spring.application.name=API_GateWay
server.port=8000

# ============================================================
# GATEWAY ROUTES
# ============================================================
spring.cloud.gateway.routes[0].id=order-service
spring.cloud.gateway.routes[0].uri=lb://OrderService
spring.cloud.gateway.routes[0].predicates[0]=Path=/order/**

spring.cloud.gateway.routes[1].id=customer-service
spring.cloud.gateway.routes[1].uri=lb://CustomerService
spring.cloud.gateway.routes[1].predicates[0]=Path=/customer/**

spring.cloud.gateway.routes[2].id=payment-service
spring.cloud.gateway.routes[2].uri=lb://PaymentService
spring.cloud.gateway.routes[2].predicates[0]=Path=/payment/**

spring.cloud.gateway.routes[3].id=notification-service
spring.cloud.gateway.routes[3].uri=lb://NotificationService
spring.cloud.gateway.routes[3].predicates[0]=Path=/notification/**

spring.cloud.gateway.routes[4].id=auth-service
spring.cloud.gateway.routes[4].uri=lb://CustomerService
spring.cloud.gateway.routes[4].predicates[0]=Path=/auth/**

# ============================================================
# ACTUATOR
# ============================================================
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always


