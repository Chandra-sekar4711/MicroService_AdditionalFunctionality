spring.application.name=OrderService

server.port=8081
spring.datasource.url=jdbc:mysql://localhost:3306/orderservice
spring.datasource.username=root
spring.datasource.password=Sekar@4711
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update

resilience4j.circuitbreaker.instances.paymentServiceCB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.paymentServiceCB.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.paymentServiceCB.sliding-window-size=10
resilience4j.circuitbreaker.instances.paymentServiceCB.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.paymentServiceCB.permitted-number-of-calls-in-half-open-state=3

resilience4j.circuitbreaker.instances.customerServiceCB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.customerServiceCB.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.customerServiceCB.sliding-window-size=10
resilience4j.circuitbreaker.instances.customerServiceCB.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.customerServiceCB.permitted-number-of-calls-in-half-open-state=3

resilience4j.retry.instances.customerServiceRT.max-attempts=3
resilience4j.retry.instances.customerServiceRT.wait-duration=10s

# CRITICAL - Enable ALL actuator endpoints
management.endpoints.web.exposure.include=health,metrics,beans,conditions,mappings
management.endpoint.health.show-details=always
management.endpoint.metrics.enabled=true
management.health.circuitbreakers.enabled=true

resilience4j.circuitbreaker.configs.default.register-health-indicator=true
resilience4j.circuitbreaker.configs.default.allow-health-indicator-to-fail=true



# Tracing configuration
management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans

# Enable HTTP tracing
management.observations.http.server.enabled=true

# Debug logging
logging.level.io.micrometer.tracing=DEBUG
logging.level.org.springframework.web=DEBUG

